name: Build VitaCast

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up VitaSDK
        uses: vitasdk/setup-vitasdk@master
        
      - name: Build VitaCast
        run: |
          make release
          
      - name: Upload VPK
        uses: actions/upload-artifact@v3
        with:
          name: VitaCast.vpk
          path: VitaCast.vpk
          
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: VitaCast.vpk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
