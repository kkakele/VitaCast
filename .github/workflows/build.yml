name: Build VitaCast

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Install vita2d
        run: |
          export PATH=$VITASDK/bin:$PATH
          $VITASDK/bin/vdpm vita2d || echo "vita2d puede estar ya instalado"
          
      - name: Build VitaCast
        run: |
          export PATH=$VITASDK/bin:$PATH
          make release
          
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: VitaCast.vpk
          path: VitaCast.vpk
          
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: VitaCast.vpk
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
