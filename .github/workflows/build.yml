name: Build VitaCast

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up VitaSDK
        run: |
          export VITASDK=/usr/local/vitasdk
          sudo mkdir -p $VITASDK
          sudo chown $USER:$USER $VITASDK
          git clone https://github.com/vitasdk/buildscripts.git /tmp/vitasdk-buildscripts
          cd /tmp/vitasdk-buildscripts
          export VITASDK=$VITASDK
          ./build.sh
          echo "VITASDK=$VITASDK" >> $GITHUB_ENV
          echo "$VITASDK/bin" >> $GITHUB_PATH
        
      - name: Build VitaCast
        env:
          VITASDK: /usr/local/vitasdk
        run: |
          export PATH=$VITASDK/bin:$PATH
          make release
          
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: VitaCast.vpk
          path: VitaCast.vpk
          
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: VitaCast.vpk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
