name: Build VitaCast Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        default: '2.0.1'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup VitaSDK
      run: |
        set -e
        
        sudo apt-get update -qq
        sudo apt-get install -y -qq make git cmake python3 wget curl build-essential
        
        export VITASDK=/usr/local/vitasdk
        
        # CRÍTICO: Eliminar directorio SIEMPRE antes de instalar
        echo "Eliminando cualquier instalación previa de VitaSDK..."
        sudo rm -rf $VITASDK 2>/dev/null || true
        echo "Directorio limpio"
        
        # También limpiar vdpm si existe
        if [ -d "$HOME/vdpm" ]; then
          echo "Eliminando vdpm existente..."
          rm -rf $HOME/vdpm
        fi
        
        # Clonar vdpm
        echo "Clonando vdpm..."
        cd $HOME
        git clone https://github.com/vitasdk/vdpm
        cd vdpm
        
        # Verificar una vez más que el directorio no existe antes de instalar
        if [ -d "$VITASDK" ]; then
          echo "ERROR: Directorio todavía existe, eliminando forzadamente..."
          sudo rm -rf $VITASDK
        fi
        
        # Instalar VitaSDK (el script creará el directorio)
        echo "Instalando VitaSDK (esto puede tomar varios minutos)..."
        ./bootstrap-vitasdk.sh
        
        # Instalar paquetes necesarios ANTES de compilar
        echo "Instalando vita2d..."
        ./vdpm vita2d
        echo "vita2d instalado exitosamente"
        
        echo "Instalando curl..."
        ./vdpm curl
        echo "curl instalado exitosamente"
        
        # Configurar variables de entorno para siguientes pasos
        echo "VITASDK=$VITASDK" >> $GITHUB_ENV
        echo "$VITASDK/bin" >> $GITHUB_PATH
        echo "VITA2D_CFLAGS=-I$VITASDK/arm-vita-eabi/include" >> $GITHUB_ENV
        echo "VITA2D_LIBS=-L$VITASDK/arm-vita-eabi/lib" >> $GITHUB_ENV
        
        # Verificar instalación
        export PATH=$VITASDK/bin:$PATH
        echo "Verificando compilador..."
        arm-vita-eabi-gcc --version
        echo "Verificando vita2d..."
        ls -la $VITASDK/arm-vita-eabi/include/vita2d.h || echo "Advertencia: vita2d.h no encontrado en ubicación esperada"
        ls -la $VITASDK/arm-vita-eabi/lib/*vita2d* || echo "Advertencia: libvita2d no encontrada"
    
    - name: Install additional dependencies
      env:
        VITASDK: /usr/local/vitasdk
      run: |
        export PATH=$VITASDK/bin:$PATH
        export VITASDK=/usr/local/vitasdk
        cd $HOME/vdpm
        ./vdpm vita2d curl
    
    - name: Build VitaCast
      env:
        VITASDK: /usr/local/vitasdk
      run: |
        export PATH=$VITASDK/bin:$PATH
        export VITASDK=/usr/local/vitasdk
        
        # Asegurar que vita2d está disponible
        echo "Buscando vita2d..."
        find $VITASDK -name "vita2d.h" -o -name "*vita2d*" | head -20
        
        # Compilar con flags correctos
        echo "Compilando main_complete.c..."
        make -f Makefile_final clean
        make -f Makefile_final release 2>&1 | tee build.log
        
        # Verificar que el VPK se creó
        if [ ! -f VitaCast.vpk ]; then
          echo "ERROR: VPK no se creó"
          echo "=== LOG DE COMPILACION ==="
          cat build.log
          exit 1
        fi
        
        echo "VPK creado exitosamente"
    
    - name: Generate checksums
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        md5sum VitaCast.vpk > VitaCast-v${VERSION}.md5
        sha256sum VitaCast.vpk > VitaCast-v${VERSION}.sha256
    
    - name: Rename VPK
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        mv VitaCast.vpk VitaCast-v${VERSION}.vpk
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: VitaCast ${{ github.ref_name }} - Release
        body: |
          # VitaCast ${{ github.ref_name }} - Release Compilado
          
          Este release fue compilado automáticamente por GitHub Actions.
          
          ## Archivos incluidos
          - VitaCast-${{ github.ref_name }}.vpk
          - Checksums MD5 y SHA256
          - INSTALL.md
          - RELEASE_NOTES.md
          
          Ver RELEASE_NOTES.md para detalles completos.
        files: |
          VitaCast-v*.vpk
          VitaCast-v*.md5
          VitaCast-v*.sha256
          INSTALL.md
          RELEASE_NOTES.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
