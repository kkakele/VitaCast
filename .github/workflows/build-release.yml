name: Build VitaCast Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        default: '2.0.1'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup VitaSDK
      run: |
        sudo apt-get update
        sudo apt-get install -y make git cmake python3 wget curl build-essential
        
        export VITASDK=/usr/local/vitasdk
        export PATH=$VITASDK/bin:$PATH
        
        # Eliminar directorio si existe (de ejecuciones anteriores)
        if [ -d "$VITASDK" ]; then
          echo "Eliminando directorio VitaSDK existente..."
          sudo rm -rf $VITASDK
        fi
        
        # Crear directorio VitaSDK
        sudo mkdir -p $VITASDK
        sudo chown -R $USER:$USER $VITASDK
        
        # Clonar vdpm
        cd $HOME
        if [ -d "vdpm" ]; then
          rm -rf vdpm
        fi
        git clone https://github.com/vitasdk/vdpm
        cd vdpm
        
        # Instalar VitaSDK
        ./bootstrap-vitasdk.sh
        
        # Instalar paquetes necesarios
        ./vdpm vita2d
        
        # Configurar variables de entorno para siguientes pasos
        echo "VITASDK=$VITASDK" >> $GITHUB_ENV
        echo "$VITASDK/bin" >> $GITHUB_PATH
    
    - name: Install additional dependencies
      env:
        VITASDK: /usr/local/vitasdk
      run: |
        export PATH=$VITASDK/bin:$PATH
        export VITASDK=/usr/local/vitasdk
        cd $HOME/vdpm
        ./vdpm vita2d curl
    
    - name: Build VitaCast
      env:
        VITASDK: /usr/local/vitasdk
      run: |
        export PATH=$VITASDK/bin:$PATH
        export VITASDK=/usr/local/vitasdk
        
        make -f Makefile_final clean || true
        make -f Makefile_final release
    
    - name: Generate checksums
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        md5sum VitaCast.vpk > VitaCast-v${VERSION}.md5
        sha256sum VitaCast.vpk > VitaCast-v${VERSION}.sha256
    
    - name: Rename VPK
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        mv VitaCast.vpk VitaCast-v${VERSION}.vpk
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: VitaCast ${{ github.ref_name }} - Release
        body: |
          # VitaCast ${{ github.ref_name }} - Release Compilado
          
          Este release fue compilado automáticamente por GitHub Actions.
          
          ## Archivos incluidos
          - VitaCast-${{ github.ref_name }}.vpk
          - Checksums MD5 y SHA256
          - INSTALL.md
          - RELEASE_NOTES.md
          
          Ver RELEASE_NOTES.md para detalles completos.
        files: |
          VitaCast-v*.vpk
          VitaCast-v*.md5
          VitaCast-v*.sha256
          INSTALL.md
          RELEASE_NOTES.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
